name: Build Multiplatform

on:
  workflow_dispatch:

env:
  COMMANDDECK_BUILD_GEMINI_API_KEY: ${{ secrets.COMMANDDECK_BUILD_GEMINI_API_KEY }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Run unit tests
        run: npx vitest run

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Tauri app
        run: npm run tauri -- build --target x86_64-pc-windows-msvc -b nsis,msi --ci

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: commanddeck-windows-x64
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error

  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Run unit tests
        run: npx vitest run

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Build Tauri app
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu -b deb,appimage --ci

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: commanddeck-linux-x64
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-macos-arm64:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Run unit tests
        run: npx vitest run

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build Tauri app
        run: npm run tauri -- build --target aarch64-apple-darwin -b dmg --ci

      - name: Upload macOS ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: commanddeck-macos-arm64
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-macos-x64:
    name: macOS Intel (x64)
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Run unit tests
        run: npx vitest run

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin

      - name: Build Tauri app
        run: npm run tauri -- build --target x86_64-apple-darwin -b dmg --ci

      - name: Upload macOS x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: commanddeck-macos-x64
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
